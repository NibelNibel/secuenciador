name: Compilar APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -q secuenciador-notas-android.zip
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Aceptar licencias del Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compilar
        working-directory: secuenciador-notas-android
        run: ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: secuenciador-notas-apk
          path: secuenciador-notas-android/secuenciador-notas.apk
